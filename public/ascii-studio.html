<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High-Fidelity Color ASCII Art</title>
<style>
  body {
    margin: 0;
    background-color: #050505;
    color: #fff;
    font-family: 'Cascadia Code', 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .controls {
    padding: 20px;
    background: #111;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    border-bottom: 1px solid #333;
    box-sizing: border-box;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  button, .file-upload {
    background: #333;
    color: white;
    border: 1px solid #555;
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
    border-radius: 4px;
    font-size: 14px;
  }
  button:hover, .file-upload:hover { background: #444; }
  input[type="file"] { display: none; }
  .slider-group {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }
  #ascii-output {
    font-size: 8px;
    line-height: 1.0;
    white-space: pre;
    font-weight: bold;
    padding: 20px;
    max-width: 100vw;
    overflow: hidden;
    text-align: center;
  }
  video, canvas, img { display: none; }
</style>
</head>
<body>
  <div class="controls">
    <button id="btn-camera">Start Camera</button>
    <label class="file-upload">
      Upload Image/Video
      <input type="file" id="input-file" accept="image/*,video/*">
    </label>
    <div class="slider-group">
      <label>Contrast:</label>
      <input type="range" id="slider-contrast" min="-100" max="100" value="20">
    </div>
    <div class="slider-group">
      <label>Color Grouping (ΔE):</label>
      <input type="range" id="slider-threshold" min="0" max="100" value="15">
    </div>
    <div class="slider-group">
      <label>Resolution:</label>
      <input type="range" id="slider-resolution" min="50" max="300" value="120">
    </div>
  </div>
  <div id="ascii-output">Start camera or upload media to begin</div>
  
  <video id="video-source" playsinline loop muted></video>
  <img id="img-source">
  <canvas id="hidden-canvas"></canvas>

  <script>
    const ASCII_RAMP = "$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'. ";
    const video = document.getElementById('video-source');
    const img = document.getElementById('img-source');
    const canvas = document.getElementById('hidden-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const output = document.getElementById('ascii-output');
    
    let isPlaying = false;
    let isVideo = false;
    let animationFrameId;

    const escapeHtml = (c) => {
      if (c === ' ') return '&nbsp;';
      if (c === '<') return '&lt;';
      if (c === '>') return '&gt;';
      if (c === '&') return '&amp;';
      if (c === '"') return '&quot;';
      return c;
    };

    const processFrame = (source, sourceWidth, sourceHeight) => {
      const resolution = parseInt(document.getElementById('slider-resolution').value);
      const contrast = parseInt(document.getElementById('slider-contrast').value);
      const threshold = parseInt(document.getElementById('slider-threshold').value);

      // Aspect ratio correction (multiply height by 0.55)
      const aspect = sourceWidth / sourceHeight;
      const width = resolution;
      const height = Math.floor((width / aspect) * 0.55);

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      ctx.drawImage(source, 0, 0, width, height);
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;
      
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      let html = '';

      for (let y = 0; y < height; y++) {
        let currentSpanColor = null;
        let currentSpanText = '';

        for (let x = 0; x < width; x++) {
          const offset = (y * width + x) * 4;
          let r = data[offset];
          let g = data[offset + 1];
          let b = data[offset + 2];

          if (contrast !== 0) {
            r = Math.max(0, Math.min(255, factor * (r - 128) + 128));
            g = Math.max(0, Math.min(255, factor * (g - 128) + 128));
            b = Math.max(0, Math.min(255, factor * (b - 128) + 128));
          }

          const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
          const charIndex = Math.floor((luminance / 255) * (ASCII_RAMP.length - 1));
          const char = escapeHtml(ASCII_RAMP[charIndex]);

          if (!currentSpanColor) {
            currentSpanColor = {r, g, b};
            currentSpanText = char;
          } else {
            const dist = Math.sqrt(
              Math.pow(r - currentSpanColor.r, 2) +
              Math.pow(g - currentSpanColor.g, 2) +
              Math.pow(b - currentSpanColor.b, 2)
            );

            if (dist <= threshold) {
              currentSpanText += char;
            } else {
              html += `<span style="color: rgb(${currentSpanColor.r},${currentSpanColor.g},${currentSpanColor.b})">${currentSpanText}</span>`;
              currentSpanColor = {r, g, b};
              currentSpanText = char;
            }
          }
        }
        if (currentSpanText) {
          html += `<span style="color: rgb(${currentSpanColor.r},${currentSpanColor.g},${currentSpanColor.b})">${currentSpanText}</span>`;
        }
        html += '<br/>';
      }

      output.innerHTML = html;
    };

    const renderLoop = () => {
      if (!isPlaying) return;
      if (isVideo && video.readyState >= 2) {
        processFrame(video, video.videoWidth, video.videoHeight);
      }
      animationFrameId = requestAnimationFrame(renderLoop);
    };

    const startVideo = () => {
      isVideo = true;
      isPlaying = true;
      video.play();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      renderLoop();
    };

    document.getElementById('btn-camera').addEventListener('click', async () => {
      try {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        startVideo();
      } catch (err) {
        alert('Camera access denied or unavailable.');
      }
    });

    document.getElementById('input-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const url = URL.createObjectURL(file);
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }

      if (file.type.startsWith('image/')) {
        isPlaying = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        
        img.onload = () => {
          processFrame(img, img.width, img.height);
        };
        img.src = url;
      } else {
        video.src = url;
        startVideo();
      }
    });

    // Re-render image when sliders change if not playing video
    ['slider-contrast', 'slider-threshold', 'slider-resolution'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        if (!isPlaying && img.src) {
          processFrame(img, img.width, img.height);
        }
      });
    });
  </script>
</body>
</html>
